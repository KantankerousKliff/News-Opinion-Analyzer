[project]
name = "toi-bias-analyzer"
version = "0.1.0"
description = "Times of India editorial bias analyzer — pre-2010 vs post-2020"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "matplotlib",
    "numpy<2",
    "scipy",
    "spacy>=3.7",
    "vadersentiment",
    "nltk",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
    "python-dotenv>=1.2.2",
]

[project.scripts]
analyze = "toi_bias_analyzer:main"
